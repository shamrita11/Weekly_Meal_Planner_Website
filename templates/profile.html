{% extends "base.html" %}

{% block content %}
<div id="page-profile" class="page active">
  <nav class="nav nav-inner">
    <div class="logo"><span class="logo-icon">👨‍🍳</span></div>
    <div class="nav-links">
      <button class="pill-btn sm" onclick="navigate('main')">Home</button>
      <button class="pill-btn sm" onclick="navigate('recipes')">Recipes</button>
      <button class="pill-btn sm" onclick="navigate('mealplan')">Meal Plan</button>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
      <div class="profile-btn active-profile">👤</div>
    </div>
  </nav>

  <div class="profile-layout">
    <div class="card profile-card">
      <div class="profile-avatar">👤</div>
      <h2 class="profile-name" id="profile-name">Loading…</h2>
      <p class="profile-email" id="profile-login-id" style="font-size:0.9rem; color:var(--text-muted);">—</p>

      <div class="profile-stats">
        <div class="stat"><span id="stat-recipes">—</span><small>Recipes</small></div>
        <div class="stat"><span id="stat-favs">—</span><small>Favourites</small></div>
      </div>

      <!-- Password Change Section -->
      <div style="width:100%; margin-top:16px; text-align:left;">
        <p style="font-size:0.9rem; font-weight:600; margin-bottom:8px;">Change Password</p>
        <input id="pw-current" class="form-input" type="password" placeholder="Current password" 
               style="margin-bottom:8px; border-radius:8px; background:rgba(255,255,255,0.08);"/>
        <input id="pw-new" class="form-input" type="password" placeholder="New password" 
               style="margin-bottom:8px; border-radius:8px; background:rgba(255,255,255,0.08);"/>
        <input id="pw-confirm" class="form-input" type="password" placeholder="Confirm new password" 
               style="margin-bottom:8px; border-radius:8px; background:rgba(255,255,255,0.08);"/>
        <p id="pw-msg" style="font-size:0.82rem; min-height:1.2em;"></p>
        <button class="pill-btn sm primary" onclick="changePassword()" style="margin-top:4px;">Update Password</button>
      </div>

      <button class="pill-btn large" style="margin-top:20px;" onclick="logoutUser()">Log Out</button>
    </div>
  </div>
</div>

<script>
// Load profile data from the backend
fetch('/auth/profile')
  .then(r => r.json())
  .then(data => {
    if (data.status === 'success') {
      document.getElementById('profile-name').textContent = data.username;
      document.getElementById('profile-login-id').textContent = 'User ID: ' + data.login_id;
      document.getElementById('stat-recipes').textContent = data.recipe_count;
      document.getElementById('stat-favs').textContent = data.fav_count;
    }
  });

function changePassword() {
  const cur = document.getElementById('pw-current').value;
  const np = document.getElementById('pw-new').value;
  const np2 = document.getElementById('pw-confirm').value;
  const msg = document.getElementById('pw-msg');
  msg.textContent = '';
  msg.style.color = '#c0392b';

  if (!cur || !np) { msg.textContent = 'Both fields are required.'; return; }
  if (np !== np2) { msg.textContent = 'New passwords do not match.'; return; }
  if (np.length < 4) { msg.textContent = 'Password must be at least 4 characters.'; return; }

  fetch('/auth/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current_password: cur, new_password: np })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'success') {
      msg.style.color = '#27ae60';
      msg.textContent = 'Password updated successfully.';
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    } else {
      msg.textContent = data.message || 'Failed to update password.';
    }
  })
  .catch(() => { msg.textContent = 'Could not connect to server.'; });
}

function logoutUser() {
  fetch('/auth/logout', { method: 'POST' })
    .then(() => { window.location.href = '/'; });
}
</script>
{% endblock %}
